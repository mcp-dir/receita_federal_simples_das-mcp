# Smithery configuration for Receita Federal: Simples (Emissão de DAS de MEI)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_receita_federal_simples_das

name: receita_federal_simples_das-mcp
displayName: "Receita Federal: Simples (Emissão de DAS de MEI)"
description: >
  Receita Federal: Simples (Emissão de DAS de MEI), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/receita_federal_simples_das-mcp
repository: https://github.com/mcp-dir/receita_federal_simples_das-mcp

tags:
  - receita_federal_simples_das
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_receita_federal_simples_das

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_receita_federal_simples_das/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
